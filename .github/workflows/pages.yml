name: Deploy site

on:
  push:
    branches: [main]
    paths-ignore:
      - "scripts/**"
      - "README.md"
      - "CLAUDE.md"
  workflow_dispatch:
  # Called by the sync workflow after it commits new numbers. A push made with GITHUB_TOKEN does
  # not start other workflows, so without this the public numbers would never refresh.
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp -r index.html embed.js CNAME app assets config data _site/
          # Stamp file links with this commit so browsers fetch new versions right after a deploy.
          sed -i "s/__BUILD__/${GITHUB_SHA::7}/g" _site/index.html _site/app/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
