name: Sync DonorPerfect

# Every 5 minutes: read the campaign's gifts from DonorPerfect, write the public numbers to
# data/live.json, and redeploy the site if anything changed.
#
# One repository secret is needed: DP_API_KEY. Until it and the campaign ID (config/campaign.json)
# are in place, the run does nothing and passes.
#
# GitHub runs scheduled jobs when it has room, so "every 5 minutes" is often 5 to 15 in practice.
# On Giving Tuesday and Giving Hearts Day, run it by hand from the Actions tab any time a fresher
# number is wanted.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: sync-donorperfect
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Read gifts from DonorPerfect
        env:
          DP_API_KEY: ${{ secrets.DP_API_KEY }}
        run: python scripts/sync_donorperfect.py
      - name: Commit new numbers
        id: commit
        run: |
          if [ -n "$(git status --porcelain data/live.json)" ]; then
            git config user.name "lightthefire-sync"
            git config user.email "actions@users.noreply.github.com"
            git add data/live.json
            git commit -m "Update live numbers"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: sync
    if: needs.sync.outputs.changed == 'true'
    uses: ./.github/workflows/pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
